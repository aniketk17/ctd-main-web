  nginx:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

  nginx-conf:
    build: ./nginx
    ports:
      - "801:80"
    depends_on:
      - app
    restart: "on-failure"

